{% extends 'base.html' %}
{% block title %}Sin permisos{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width:520px">
  <i class="bi bi-shield-lock" style="font-size:3rem;color:#adb5bd"></i>
  <h4 class="mt-3">No tenés permisos para ninguna sección</h4>
  <p class="text-muted">Pedile al administrador que te habilite desde Configuración → Permisos.</p>
  <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary">Cerrar sesión</a>
</div>
{% endblock %}
